name: Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        run: |
          docker build \
            -t 237024525392.dkr.ecr.ap-south-1.amazonaws.com/docker-test-backend:latest \
            ./backend

          docker push \
            237024525392.dkr.ecr.ap-south-1.amazonaws.com/docker-test-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://app.test.silverpinelabs.com \
            -t 237024525392.dkr.ecr.ap-south-1.amazonaws.com/docker-test-frontend:latest \
            ./frontend

          docker push \
            237024525392.dkr.ecr.ap-south-1.amazonaws.com/docker-test-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/docker-test

            git pull origin main

            aws ecr get-login-password --region ap-south-1 | \
              sudo docker login \
              --username AWS \
              --password-stdin \
              237024525392.dkr.ecr.ap-south-1.amazonaws.com

            sudo docker compose pull

            sudo docker compose up -d

            echo "Checking containers..."
            sudo docker compose ps

            echo "Checking application..."

            for i in {1..10}; do
              if curl -f http://localhost:3001; then
                echo "Application is healthy!"
                exit 0
              fi

              echo "Application not ready yet... retrying in 3 seconds"
              sleep 3
            done

            echo "Application health check failed!"
            exit 1
