services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://13.234.128.41:5000
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
