services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://13.234.128.41:5000
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db-migration-ec2.c9ug64u4komr.ap-south-1.rds.amazonaws.com
      PMA_PORT: 3306
    ports:
      - "8080:80"
